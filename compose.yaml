# Single-host container deployment for mc-server-dashboard v2 (issue #189).
#
# Services:
#   db        — PostgreSQL, the API's authoritative metadata store.
#   migrate   — one-shot `alembic upgrade head` (same image as api), runs after db.
#   seaweedfs — the S3-compatible object store the API uses by default (issue #702);
#               gated behind the `object` compose profile (default-on via
#               COMPOSE_PROFILES in .env.example, issue #940).
#   api       — the FastAPI app + control-plane gRPC server, runs after migrate.
#   worker    — the execution agent; container driver only, talks to the host
#               Docker daemon via the mounted socket and creates sibling Minecraft
#               containers.
#   relay     — the game ingress relay (epic #659, issue #960); gated behind the
#               `relay` compose profile (opt-in). Accepts player TCP on :25565,
#               and the Worker dial-back on :25665 (TLS). Requires a wildcard DNS
#               record and TLS material — see docs/dev/DEPLOYMENT.md "Relay".
#               Also carries Bedrock (RakNet/UDP): the Worker's QUIC tunnel on
#               :25675/udp plus the client-facing per-server UDP window
#               19132-19231/udp (epic #1540) — see docs/app/BEDROCK.md and
#               docs/app/BEDROCK_TUNNEL.md.
#   cloudflared — Cloudflare Tunnel for HTTPS access without opening inbound ports
#               (issue #1090); gated behind the `tunnel` compose profile (opt-in).
#               The tunnel is configured in the Cloudflare Zero Trust dashboard;
#               only the tunnel token is needed locally.
#
# Storage backend (issue #702): the shipped default is the `object` backend on the
# SeaweedFS service below (STORAGE.md Section 7.3). To run the fs backend instead,
# see docs/dev/DEPLOYMENT.md "Opting back to the fs backend".
#
# Secrets and host-specific values come from .env (see .env.example). MC server
# containers are NOT compose services: the worker creates them at runtime, on
# their own `mcsd-servers` network — they run untrusted third-party code and are
# kept off the control plane (see the `networks:` block at the bottom, issue
# #2590). See docs/dev/DEPLOYMENT.md.

# The compose project name. Pinned so it no longer defaults to the checkout's
# directory name, which made the network names below depend on where the repo
# happened to be cloned (issue #2609). Every name compose derives — networks,
# volumes, container names — hangs off this value, and the networks and the
# worker's target network are interpolated from it via ${COMPOSE_PROJECT_NAME}
# so a second stack gets its own fabric instead of joining this one.
#
# WARNING: this pin is global, so `docker compose up` in ANY checkout of this
# repository — the deploy root or an agent worktree — targets project `mcsd`,
# i.e. THE LIVE DEPLOYMENT: it recreates the live containers and mounts the live
# volumes. `-p <name>` / COMPOSE_PROJECT_NAME=<name> is what makes a second
# stack a second stack; both override this key and flow into the interpolations
# below (verified on Compose v5.1.4). See docs/dev/AGENTS.md Section 1.
name: mcsd

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      # `:?` rejects unset OR empty so a blank DB password (which the api's
      # MCD_API_DATABASE__URL is built from) fails loudly rather than booting an
      # unauthenticated/unconnectable DB (#939).
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env, e.g. openssl rand -base64 32}"
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Mounted at the PARENT directory, not .../data: postgres:18 moved PGDATA
      # to /var/lib/postgresql/<major>/docker and declares VOLUME
      # /var/lib/postgresql (docker-library/postgres#1259). With the legacy
      # .../data mount the entrypoint sees that path as a mountpoint and aborts
      # before postgres ever starts, so the healthcheck has nothing to probe
      # (#2133). Upgrading an existing deployment needs a dump/restore first --
      # see docs/dev/DEPLOYMENT.md Section 9.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    # Build context is the repo root so the api image's webui stage can reach
    # webui/ (issue #490); the Dockerfile copies the python app from api/.
    build:
      context: .
      dockerfile: api/Dockerfile
    image: mcsd-api:dev
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      MCD_API_DATABASE__URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy

  seaweedfs:
    # The S3-compatible object store backing the default `object` storage backend
    # (issue #702, STORAGE.md Section 7.3). SeaweedFS is Apache-2.0, master/volume,
    # and designed for many small files — the object adapter's hot path is
    # CopyObject-heavy and small-object-heavy (thousands of region/.mca per world).
    # Pinned to an explicit version tag (never `latest`) so a rebuild is
    # reproducible.
    image: chrislusf/seaweedfs:4.41
    restart: unless-stopped
    # Gated behind the `object` compose profile so an fs-backend operator can drop
    # the service entirely (issue #940). `.env.example` ships COMPOSE_PROFILES=object
    # as the default, so the default experience is unchanged: seaweedfs runs and its
    # entrypoint guard enforces non-blank credentials. An fs operator sets
    # COMPOSE_PROFILES= (empty) + MCD_API_STORAGE__BACKEND=fs and is then free of both
    # this service and the running instance — and of the credential requirement (the
    # env below uses `:-`, not `:?`, so `config`/`up` resolve with no keys set).
    profiles: ["object"]
    # All-in-one `server` (master+volume+filer) with the S3 gateway. The S3
    # identities file is written from .env at startup so the access/secret keys
    # live only in .env (matching the db-password posture) and never in the image
    # or a committed config. The bucket is auto-created by SeaweedFS on first PUT,
    # so no init job is needed.
    #
    # WHAT THIS BINDS, and who can reach it. `netstat -lntp` inside this container
    # with the entrypoint flags as they stood on 2026-08-02, before
    # -s3.port.iceberg=0 was added below (4.40; the surface was first reported in
    # #2599 / #2616), shows NINE TCP listeners, not one:
    #
    #   8333   S3 gateway (access/secret keys from .env)
    #   8888   filer HTTP        9333   master HTTP     8080   volume HTTP
    #   8181   Iceberg REST     18333   S3 gRPC        18080  volume gRPC
    #  18888   filer gRPC       19333   master gRPC
    #
    # Credential enforcement, probed uncredentialed against that probe's flags:
    # 8333 rejects every data-path call (403; its /status probe answers 200,
    # which is what the healthcheck below uses). 8181 rejects catalog calls
    # (/v1/namespaces 403) but serves /v1/config open. 8888 filer answers 200
    # with no credential at all and serves the same object bytes the S3 gateway
    # does; 9333 master and 8080 volume are likewise uncredentialed, and a
    # master /dir/lookup followed by a volume read reaches those same bytes in
    # two hops. 18333 answers gRPC reflection uncredentialed
    # (`SeaweedS3IamCache`, `SeaweedS3LifecycleInternal`). So every member of the
    # `mcsd` network below is effectively an object-store admin over every
    # tenant's data. None of these ports is published to the host.
    #
    # What keeps that off attacker-controlled code is the TOPOLOGY, not this
    # service's configuration: the Minecraft server containers run third-party
    # plugins and are attached to `mcsd-servers`, a different network (issue
    # #2590). Do not attach anything that runs untrusted code to `mcsd`.
    #
    # 8181 NO LONGER BINDS: the entrypoint below passes -s3.port.iceberg=0, which
    # `weed server -h` on the pinned 4.41 documents as "Iceberg REST Catalog
    # server listen port (0 to disable)". Verified 2026-08-21 against
    # chrislusf/seaweedfs:4.41 outside compose, on a throwaway internal network:
    # with the flag 8181 is absent from `netstat -lnt` and a peer container's GET
    # /v1/config on 8181 is refused; without it that same GET answers 200. The
    # other eight listeners are unchanged. The enumeration above still reports the
    # 2026-08-02 probe because the deployment has not been rebuilt on the flag —
    # re-probe from an `mcsd` peer after the next deploy (issue #2626 stays open
    # until then).
    #
    # THE OTHER EIGHT ARE UNCHANGED, and that is an ACCEPTED RESIDUAL, not a
    # pending fix (decided on #2626, 2026-08-20). The peers left on `mcsd` are
    # api, db, worker, relay and cloudflared (the networks block below names three
    # more: seaweedfs itself, and the one-shots migrate and seaweedfs-lifecycle,
    # which run to completion and exit). Of the eight listeners, only 8333 asks
    # for a credential — the filer, master, volume and gRPC listeners answer all
    # five peers with none, and 18333 also serves the S3 IAM RPCs (PutIdentity,
    # RemoveIdentity, PutPolicy, …), so any of the five can mint itself an
    # identity 8333 then accepts. Two of them, relay and cloudflared, terminate
    # internet traffic. Accepted because each is a first-party control-plane
    # service and the only control that closes the surface is cluster-wide mTLS —
    # `weed server` has no -jwt.* flags (JWT lives in security.toml), and
    # security.toml's grpc.s3 mTLS cannot be scoped to one port, it escalates to
    # the whole cluster (#2608). Long form: docs/app/SECURITY.md Section 6.
    entrypoint:
      - sh
      - -c
      - |
        # Refuse to write a blank-credential identities file: SeaweedFS 4.33
        # authenticates blank-key clients, so an empty key would boot a silently
        # unauthenticated store. This guard is THE fail-fast for the seaweedfs side:
        # the compose env below uses `:-` (not `:?`) because compose interpolates a
        # service's env even when its profile is inactive, so a `:?` here would break
        # the fs opt-out (empty profile, no creds) at `config`/`up` time (issue #940).
        # This container only runs when the `object` profile is active, so reaching
        # here with blank keys is a real misconfiguration — fail loudly (issue #702).
        if [ -z "$$MCD_API_STORAGE__OBJECT__ACCESS_KEY" ] || [ -z "$$MCD_API_STORAGE__OBJECT__SECRET_KEY" ]; then
          echo "FATAL: MCD_API_STORAGE__OBJECT__ACCESS_KEY/SECRET_KEY must be set to non-empty values (see .env.example)" >&2
          exit 1
        fi
        mkdir -p /etc/seaweedfs
        printf '{"identities":[{"name":"mcsd","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' \
          "$$MCD_API_STORAGE__OBJECT__ACCESS_KEY" "$$MCD_API_STORAGE__OBJECT__SECRET_KEY" > /etc/seaweedfs/s3.json
        # -master.garbageThreshold=0.1 lowers SeaweedFS's vacuum trigger from its
        # 0.3 default so the built-in periodic auto-vacuum reclaims garbage earlier —
        # before compaction loses the free-disk headroom it needs to write the
        # compacted volume (2026-07-23 incident: garbage was ~63%, already above the
        # 0.3 default, yet the host still spiraled to 97%). This workload's
        # write-heavy CopyObject/multipart snapshot churn favors more frequent,
        # smaller compactions (docs/dev/DEPLOYMENT.md Section 5, "Vacuum tuning and
        # manual recovery").
        # -s3.port.iceberg=0 drops the Iceberg REST catalog listener (8181) from
        # the surface enumerated above; nothing in this deployment uses it.
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -master.garbageThreshold=0.1 -s3.port.iceberg=0
    environment:
      # `:-` (empty default), NOT `:?`: compose interpolates a service's env even
      # when its profile is inactive, so a `:?` here would break the fs opt-out
      # (empty profile, no creds) at `config`/`up` time. The blank-key fail-fast for
      # this service is the entrypoint guard above; it runs only under the `object`
      # profile (issue #940, #702).
      MCD_API_STORAGE__OBJECT__ACCESS_KEY: "${MCD_API_STORAGE__OBJECT__ACCESS_KEY:-}"
      MCD_API_STORAGE__OBJECT__SECRET_KEY: "${MCD_API_STORAGE__OBJECT__SECRET_KEY:-}"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      # The S3 gateway's /status returns 200 once it is serving (no auth needed).
      test: ["CMD", "curl", "-fsS", "http://localhost:8333/status"]
      interval: 5s
      timeout: 5s
      retries: 20

  seaweedfs-lifecycle:
    # One-shot bucket provisioner (issue #2260), mirroring `migrate`: it applies
    # the `AbortIncompleteMultipartUpload` lifecycle rule on the mcsd bucket — the
    # storage-layer backstop the object sweep's own comments recommend for orphan
    # multipart parts (STORAGE.md Section 7.3, DEPLOYMENT.md Section 5). Reuses the
    # api image (its `aioboto3` ships a working SYNC boto3) with the script
    # bind-mounted, so no new image or dependency. Gated behind the `object`
    # profile like seaweedfs, and waits for the S3 gateway to be healthy before
    # provisioning. The script self-verifies (GetBucketLifecycleConfiguration) and
    # exits non-zero if the rule is not honored, so this service never no-ops.
    build:
      context: .
      dockerfile: api/Dockerfile
    image: mcsd-api:dev
    restart: "no"
    profiles: ["object"]
    command: ["python", "/app/scripts/provision_object_lifecycle.py"]
    volumes:
      - ./scripts/provision_object_lifecycle.py:/app/scripts/provision_object_lifecycle.py:ro
    environment:
      MCD_API_STORAGE__OBJECT__ENDPOINT: http://seaweedfs:8333
      MCD_API_STORAGE__OBJECT__BUCKET: ${MCD_API_STORAGE__OBJECT__BUCKET:-mcsd}
      # `:-` (empty default), NOT `:?`: compose interpolates a service's env even
      # when its profile is inactive, matching the seaweedfs/api posture. The
      # blank-key fail-fast lives in the script (it exits non-zero on empty keys);
      # it runs only under the `object` profile (#940, #702).
      MCD_API_STORAGE__OBJECT__ACCESS_KEY: "${MCD_API_STORAGE__OBJECT__ACCESS_KEY:-}"
      MCD_API_STORAGE__OBJECT__SECRET_KEY: "${MCD_API_STORAGE__OBJECT__SECRET_KEY:-}"
    depends_on:
      seaweedfs:
        condition: service_healthy

  api:
    # Build context is the repo root so the webui stage can reach webui/
    # (issue #490); the Dockerfile copies the python app from api/.
    build:
      context: .
      dockerfile: api/Dockerfile
    image: mcsd-api:dev
    restart: unless-stopped
    environment:
      # An entry below with a LITERAL value is a pin this deployment owns, not a
      # default: setting that same MCD_API_* name in .env changes nothing,
      # because what compose puts in the container wins (issue #2585). Those are
      # DATABASE__URL (composed from the POSTGRES_* values), WEBUI__DIST_DIR and
      # STORAGE__FS__ROOT (paths inside the image / the mounted volume),
      # STORAGE__OBJECT__ENDPOINT (the in-compose gateway) and
      # CONTROL__TLS__INSECURE (the private-network posture) — each pinned for
      # the reason given where it appears. Every other entry is a
      # `${VAR:-default}` knob an operator sets in .env.
      MCD_API_DATABASE__URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # `:?` rejects unset OR empty so a blank signing key / worker credential
      # fails loudly here rather than slipping past the api's fail-fast (#939).
      MCD_API_AUTH__TOKEN__SIGNING_KEY: "${MCD_API_AUTH__TOKEN__SIGNING_KEY:?set MCD_API_AUTH__TOKEN__SIGNING_KEY in .env, e.g. openssl rand -base64 48}"
      MCD_API_CONTROL__WORKER_CREDENTIAL: "${MCD_API_CONTROL__WORKER_CREDENTIAL:?set MCD_API_CONTROL__WORKER_CREDENTIAL in .env, e.g. openssl rand -base64 48}"
      # Serve the built SPA from the api origin (no reverse proxy, no CORS): the
      # image builds webui/dist into this path (WEBUI_SPEC 7.7, issue #490).
      MCD_API_WEBUI__DIST_DIR: /app/webui/dist
      # Plaintext gRPC control listener on the private `mcsd` network. Cross-host
      # workers require real TLS instead (see docs/dev/DEPLOYMENT.md).
      MCD_API_CONTROL__TLS__INSECURE: "true"
      # The container-side HTTP bind (issue #2585). The image no longer hardcodes
      # `--host/--port`, so these two settings ARE the bind; forwarded with `:-`
      # defaults so the .env knobs are not silently inert here, the same posture
      # as the metrics listener below. They are the CONTAINER side of the split:
      # API_HTTP_BIND_IP / API_HTTP_PORT under `ports:` stay the HOST side.
      # Under compose the default 0.0.0.0 host is the CORRECT value: the bind
      # happens inside the container's own network namespace, so loopback there
      # leaves the published port below unreachable from the host while the
      # healthcheck (which probes container-localhost) still reports healthy.
      # Moving HTTP_PORT moves the publish target, the healthcheck and the two
      # base URLs with it — they all interpolate it. What it does NOT move is
      # the `http://api:8000` target configured in the Cloudflare Zero Trust
      # dashboard (docs/dev/DEPLOYMENT.md Section 8); update that by hand.
      MCD_API_SERVER__HOST: "${MCD_API_SERVER__HOST:-0.0.0.0}"
      MCD_API_SERVER__HTTP_PORT: "${MCD_API_SERVER__HTTP_PORT:-8000}"
      # MUST be overridden to the externally reachable origin on any real
      # deployment: client-facing URLs (e.g. resource-pack download links)
      # are rendered from this value. Contrast with DATA_PLANE_BASE_URL
      # below, which is intentionally internal-only (worker-facing).
      MCD_API_SERVER__PUBLIC_BASE_URL: ${MCD_API_SERVER__PUBLIC_BASE_URL:-http://api:${MCD_API_SERVER__HTTP_PORT:-8000}}
      # Worker-facing data-plane base URL, kept pinned to the internal
      # compose-network address regardless of what PUBLIC_BASE_URL above is set
      # to (issue #1549). An operator behind an edge proxy with a body-size cap
      # (e.g. Cloudflare Tunnel, ~100 MB) may override PUBLIC_BASE_URL to the
      # externally reachable tunnel hostname for public-facing links; without a
      # separate internal URL the co-located worker's snapshot/hydrate uploads
      # would hairpin through that edge and 413 on every booted server. See
      # docs/dev/DEPLOYMENT.md Section 8.
      MCD_API_SERVER__DATA_PLANE_BASE_URL: ${MCD_API_SERVER__DATA_PLANE_BASE_URL:-http://api:${MCD_API_SERVER__HTTP_PORT:-8000}}
      # Storage backend (issue #702): the shipped default is `object` on the
      # seaweedfs service. Set MCD_API_STORAGE__BACKEND=fs in .env to opt back to
      # the local-volume fs backend (the fs root + volume below stay wired so the
      # opt-out needs no other change). See docs/dev/DEPLOYMENT.md.
      MCD_API_STORAGE__BACKEND: ${MCD_API_STORAGE__BACKEND:-object}
      MCD_API_STORAGE__FS__ROOT: /data/storage
      # Object-backend wiring (read only when backend=object): the in-compose
      # SeaweedFS S3 gateway, reached by service name on the internal network. The
      # access/secret keys come from .env (matching the db-password posture).
      MCD_API_STORAGE__OBJECT__ENDPOINT: http://seaweedfs:8333
      MCD_API_STORAGE__OBJECT__BUCKET: ${MCD_API_STORAGE__OBJECT__BUCKET:-mcsd}
      # `:-` (empty default), NOT `:?`: this env evaluates ALWAYS, including in fs
      # mode where no creds exist, so a `:?` here would break the fs opt-out
      # (issue #940). The fail-fast for object mode lives where the backend is
      # actually known: the api's `_build_storage` rejects blank object creds at boot
      # (naming the variables), and the seaweedfs entrypoint guard refuses a
      # blank-key identities file when the `object` profile is active (#702).
      MCD_API_STORAGE__OBJECT__ACCESS_KEY: "${MCD_API_STORAGE__OBJECT__ACCESS_KEY:-}"
      MCD_API_STORAGE__OBJECT__SECRET_KEY: "${MCD_API_STORAGE__OBJECT__SECRET_KEY:-}"
      # Relay API-side settings (lands with #956). `:-` defaults so default
      # bring-up is unchanged: ENABLED defaults to `false` and the credential /
      # base domain to empty, leaving the relay off unless explicitly configured.
      MCD_API_RELAY__ENABLED: "${MCD_API_RELAY__ENABLED:-false}"
      MCD_API_RELAY__CREDENTIAL: "${MCD_API_RELAY__CREDENTIAL:-}"
      MCD_API_RELAY__BASE_DOMAIN: "${MCD_API_RELAY__BASE_DOMAIN:-}"
      # Bedrock ingress capability gate (epic #1540, issue #1541): `:-` default
      # so default bring-up is unchanged (Geyser detection allocates nothing and
      # server responses carry no bedrock_address/bedrock_port until this is set
      # true). See docs/app/BEDROCK.md and docs/dev/DEPLOYMENT.md "Relay".
      MCD_API_RELAY__BEDROCK_ENABLED: "${MCD_API_RELAY__BEDROCK_ENABLED:-false}"
      # Reconciler tuning (issue #985). Defaults preserve existing behavior.
      # To speed self-heal after an API restart, lower HELD_START_GRACE_SECONDS
      # (default 90 s) rather than GRACE_SECONDS (which has a ~630 s safety floor).
      MCD_API_RECONCILER__INTERVAL_SECONDS: "${MCD_API_RECONCILER__INTERVAL_SECONDS:-60}"
      MCD_API_RECONCILER__GRACE_SECONDS: "${MCD_API_RECONCILER__GRACE_SECONDS:-660}"
      MCD_API_RECONCILER__HELD_START_GRACE_SECONDS: "${MCD_API_RECONCILER__HELD_START_GRACE_SECONDS:-90}"
      MCD_API_RECONCILER__REFUSED_STOP_GRACE_SECONDS: "${MCD_API_RECONCILER__REFUSED_STOP_GRACE_SECONDS:-30}"
      MCD_API_RECONCILER__BACKOFF_BASE_SECONDS: "${MCD_API_RECONCILER__BACKOFF_BASE_SECONDS:-30}"
      MCD_API_RECONCILER__BACKOFF_MAX_SECONDS: "${MCD_API_RECONCILER__BACKOFF_MAX_SECONDS:-3600}"
      # Game-port auto-assignment range (issue #1002). Defaults match the api's
      # built-in window (25565..25664); set these in .env to shift the range as a
      # fallback (e.g. off the relay's host binds). In relay mode the api already
      # excludes the relay game/tunnel ports from this range automatically.
      MCD_API_PORTS__RANGE_START: "${MCD_API_PORTS__RANGE_START:-25565}"
      MCD_API_PORTS__RANGE_END: "${MCD_API_PORTS__RANGE_END:-25664}"
      # Prometheus exposition on its own listener (issue #2565), off by default.
      # It is NOT served on 8000: cloudflared forwards the whole public hostname
      # to api:8000, so a route there is a route on the internet. Set
      # MCD_API_METRICS__ENABLED=true in .env to bind it, then scrape it from a
      # service on `mcsd` at http://api:9090/metrics -- the port is
      # deliberately absent from `ports:` below, which is what keeps it private.
      # HOST/PORT are forwarded so the .env knobs are not silently inert here,
      # but under compose the default 0.0.0.0 is the CORRECT value: the bind is
      # inside the container's own network namespace, and narrowing it to
      # loopback only makes the endpoint unscrapeable by any sibling service.
      MCD_API_METRICS__ENABLED: "${MCD_API_METRICS__ENABLED:-false}"
      MCD_API_METRICS__HOST: "${MCD_API_METRICS__HOST:-0.0.0.0}"
      MCD_API_METRICS__PORT: "${MCD_API_METRICS__PORT:-9090}"
    volumes:
      - api-storage:/data/storage
    ports:
      - "${API_HTTP_BIND_IP:-127.0.0.1}:${API_HTTP_PORT}:${MCD_API_SERVER__HTTP_PORT:-8000}"   # HTTP REST + /data-plane
      # The gRPC control plane (50051) is intentionally NOT published to the
      # host: the in-compose worker dials api:50051 over the internal network,
      # and the plaintext control listener must never be reachable off-host.
      # A cross-host worker requires control-plane TLS (see docs/dev/DEPLOYMENT.md).
      # The metrics listener (9090, when MCD_API_METRICS__ENABLED=true) is NOT
      # published either: it is scraped from inside this network, and publishing
      # it would undo the fix for issue #2565.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${MCD_API_SERVER__HTTP_PORT:-8000}/api/healthz')"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      migrate:
        condition: service_completed_successfully
      # `required: false` so the api still starts when the `object` profile is off
      # (fs opt-out, issue #940): the dependency is enforced (wait for healthy) only
      # when seaweedfs is part of the active profile set, and ignored otherwise.
      seaweedfs:
        condition: service_healthy
        required: false
      # Block the api until the mcsd bucket's lifecycle rule is provisioned
      # (issue #2260). `required: false` for the same reason as seaweedfs above:
      # the one-shot is `object`-profile-gated, so in fs mode it is not in the
      # active profile set and this dependency is ignored.
      seaweedfs-lifecycle:
        condition: service_completed_successfully
        required: false

  worker:
    build: ./worker
    image: mcsd-worker:dev
    restart: unless-stopped
    environment:
      MCD_WORKER_API_GRPC_ENDPOINT: api:50051
      MCD_WORKER_API_CREDENTIAL: ${MCD_API_CONTROL__WORKER_CREDENTIAL}
      # Plaintext control + data-plane dial on the private `mcsd` network.
      MCD_WORKER_API_TLS_INSECURE: "true"
      MCD_WORKER_WORKER_DRIVERS: container
      MCD_WORKER_WORKER_SCRATCH_DIR: ${MCSD_SCRATCH_DIR}
      # Per-Java-major base images for the Minecraft server containers the worker
      # creates. Covers every Java major the worker's bracket table can resolve
      # (javaruntime.MajorsFor): 7/8/11/16/17/21/25. Temurin ships no `16-jre` tag,
      # so major 16 uses `eclipse-temurin:16-jdk` (the closest correct image).
      # Major 7 deviates from the Temurin family because Adoptium publishes no
      # Java 7 image; `azul/zulu-openjdk:7` provides the JRE MC <= 1.7.9 needs.
      MCD_WORKER_DRIVER_CONTAINER_IMAGES: "25=eclipse-temurin:25-jre,21=eclipse-temurin:21-jre,17=eclipse-temurin:17-jre,16=eclipse-temurin:16-jdk,11=eclipse-temurin:11-jre,8=eclipse-temurin:8-jre,7=azul/zulu-openjdk:7"
      # Publish each server's game port on all host interfaces so players connect
      # from outside the host (the code default is 127.0.0.1, loopback-only). The
      # host firewall governs which game ports are actually reachable. RCON always
      # stays on loopback regardless of this value.
      # Set MCD_WORKER_GAME_BIND_IP=127.0.0.1 in .env when the relay is enabled
      # (relay path: Worker dials its own loopback, no inbound game-port range needed).
      MCD_WORKER_DRIVER_CONTAINER_GAME_BIND_IP: "${MCD_WORKER_GAME_BIND_IP:-0.0.0.0}"
      # Attach the MC containers the worker creates to the dedicated `servers`
      # network, NOT to the control-plane `default` network the api/db/seaweedfs
      # sit on (issue #2590): those containers run operator- and
      # community-supplied JARs, plugins and mods, so they are untrusted
      # workloads and must not share a network with the services that hold every
      # tenant's data. RCON is still reached over the docker network at the
      # container's name, never the host loopback. Inside this containerized
      # worker the host loopback is the worker's own namespace, so the historical
      # loopback-published RCON is unreachable (issue #218). With this set the
      # worker also DROPS the host RCON publication: RCON never leaves the network.
      #
      # This is the worker's ONLY source for that network name (config.go
      # `DRIVER_CONTAINER_NETWORK` -> main.go containerdriver.Options.Network), so
      # it MUST render the same string as `networks.servers.name` at the bottom of
      # this file — hence the identical expression rather than a literal (issue
      # #2609). A second stack's worker then attaches its MC containers to that
      # stack's `servers` network, not to this one's.
      MCD_WORKER_DRIVER_CONTAINER_NETWORK: ${COMPOSE_PROJECT_NAME:-mcsd}-servers
    # The Docker socket is how the container driver creates sibling MC containers.
    # The worker runs as root (worker/Dockerfile), so it reads the socket
    # regardless of group ownership.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # The scratch dir MUST be bind-mounted at the SAME absolute path on host and
      # in-container: the worker tells the Docker daemon to bind a server's working
      # dir into its MC container, and the daemon resolves that bind against HOST
      # paths. Identical paths make the worker's in-container path a valid host
      # path. The worker-id under it also survives container recreation this way.
      - ${MCSD_SCRATCH_DIR}:${MCSD_SCRATCH_DIR}
    # The ONLY dual-homed service (issue #2590), and it has to be: it dials
    # api:50051 (control plane) and api:8000 (data-plane transfers) on `default`
    # (mcsd), and resolves each MC container's name for its RCON and relay game
    # dials on `servers` (mcsd-servers). Listing networks explicitly opts this
    # service out of the implicit default-only attachment, so both must appear.
    #
    # gw_priority pins which endpoint provides the worker's DEFAULT ROUTE. With
    # two attachments Docker picks one, and the choice is not a documented
    # contract -- it currently lands on `default` because of endpoint ordering,
    # which a rename of either network could silently flip. It has to be
    # `default`: everything the worker sends off-subnet (a cross-host api or
    # relay) would otherwise egress through the bridge that hostile MC containers
    # sit on, where they hold CAP_NET_RAW and can spoof (SECURITY.md Section 6).
    # Verified 2026-08-02: default route via 172.19.0.1, the mcsd gateway, and
    # moving the priority to the other attachment moves the route with it.
    # Needs Engine 28.0+ / Compose 2.34.0+ (DEPLOYMENT.md Section 2 tables what
    # each under-floor version band actually does; two of them fail silently).
    networks:
      default:
        gw_priority: 100
      servers: {}
    # init: true injects Docker's tini as PID 1 so it reaps zombie grandchildren
    # (e.g. processes re-parented from Forge installer forks) that exec.Cmd.Wait
    # cannot reap because the worker itself runs as PID 1 without an init.
    init: true
    depends_on:
      api:
        condition: service_healthy

  relay:
    build: ./relay
    image: mcsd-relay:dev
    restart: unless-stopped
    # Gated behind the `relay` compose profile so default bring-up is unchanged
    # (issue #960, epic #659). Add `relay` to COMPOSE_PROFILES in .env to enable
    # it, then configure the required relay keys in .env (see .env.example and
    # docs/dev/DEPLOYMENT.md "Relay").
    profiles: ["relay"]
    environment:
      MCD_RELAY_API_GRPC_ENDPOINT: api:50051
      # `:-` (empty default), NOT `:?`: compose interpolates a service's env even
      # when its profile is inactive, so a `:?` here would break plain
      # `docker compose config` / `up` when the relay profile is off (same
      # reason as the seaweedfs object keys, issue #940). The blank-credential
      # fail-fast for this service is the relay binary's own config validation,
      # which refuses an empty api.credential at startup. Only runs under the
      # `relay` profile, so reaching here with a blank key is a real
      # misconfiguration — the relay exits immediately with a clear error.
      MCD_RELAY_API_CREDENTIAL: "${MCD_API_RELAY__CREDENTIAL:-}"
      # Plaintext control dial on the private `mcsd` network (same posture as
      # the worker; the gRPC port is not published to the host).
      MCD_RELAY_API_TLS_INSECURE: "true"
      MCD_RELAY_TUNNEL_PUBLIC_ENDPOINT: "${MCD_RELAY_TUNNEL_PUBLIC_ENDPOINT:-}"
      # Tunnel TLS material (cert + key) are bind-mounted by the operator into
      # /etc/mcsd/; self-signed is fine — the CA travels in-band to Workers.
      MCD_RELAY_TUNNEL_TLS_CERT_FILE: /etc/mcsd/tunnel-cert.pem
      MCD_RELAY_TUNNEL_TLS_KEY_FILE: /etc/mcsd/tunnel-key.pem
      # Reads the same operator setting as the API's relay.bedrock_enabled
      # (issue #1584): a single flag gates the Bedrock QUIC/UDP listener on
      # both services. Default false, so a Java-only relay neither binds nor
      # requires the Bedrock UDP ports below.
      MCD_RELAY_BEDROCK_ENABLED: "${MCD_API_RELAY__BEDROCK_ENABLED:-false}"
    volumes:
      # Mount the tunnel TLS material (self-signed or CA-issued) from the host.
      # Generate once: see docs/dev/DEPLOYMENT.md "Relay — TLS material".
      # The operator sets MCD_RELAY_TLS_DIR in .env to the host directory that
      # contains tunnel-cert.pem and tunnel-key.pem.
      - "${MCD_RELAY_TLS_DIR:-/etc/mcsd/relay}:/etc/mcsd:ro"
    ports:
      - "25565:25565"    # game listener (players join here)
      # Tunnel listener (Workers dial back here), published on LOOPBACK by
      # default (issue #2627). A publication with no host IP is DNATed from
      # every interface, so it stays reachable from the Minecraft containers on
      # mcsd-servers through the bridge gateways and the host's LAN address --
      # the network split (issue #2590) removes the docker-network path to the
      # relay but not the host-published one (docs/app/SECURITY.md Section 6).
      # The in-compose Worker needs no host publication at all: it dials
      # MCD_RELAY_TUNNEL_PUBLIC_ENDPOINT, which is relay:25665 on mcsd for a
      # single-host deployment. A Worker on ANOTHER host does need it -- set
      # RELAY_CONTROL_BIND_IP to an address that Worker can reach and point
      # MCD_RELAY_TUNNEL_PUBLIC_ENDPOINT at the same address
      # (docs/dev/DEPLOYMENT.md Section 8).
      - "${RELAY_CONTROL_BIND_IP:-127.0.0.1}:25665:25665"
      # Bedrock QUIC tunnel listener (docs/app/BEDROCK_TUNNEL.md): carries only
      # the Worker's outbound tunnel dial, not player traffic. Published here
      # unconditionally -- Compose has no clean per-port conditional syntax on
      # a single service -- but the relay process itself binds this port only
      # when MCD_RELAY_BEDROCK_ENABLED is true (default false, issue #1584);
      # see the upgrade note in docs/dev/DEPLOYMENT.md "Relay" for the
      # residual host-port-conflict caveat this leaves on a Bedrock-off relay.
      # Not bind-scoped like 25665 above: the decision on issue #2627 took a
      # single bind variable, for the Java control port, so this one stays
      # published on every interface and its residual is recorded in
      # docs/app/SECURITY.md Section 6.
      - "25675:25675/udp"
      # Client-facing per-server Bedrock UDP window (docs/app/BEDROCK.md):
      # matches the API's ports.bedrock_range_start..end default
      # (CONFIGURATION.md Section 5.8). Bedrock players connect directly to a
      # port in this window; the relay binds one port from it per live
      # Bedrock tunnel (BEDROCK_TUNNEL.md Section 3). Same publish-vs-bind
      # caveat as above.
      - "19132-19231:19132-19231/udp"
    depends_on:
      api:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:2026.7.3
    restart: unless-stopped
    # Gated behind the `tunnel` compose profile so default bring-up is unchanged
    # (issue #1090). Add `tunnel` to COMPOSE_PROFILES in .env to enable it, then
    # set CLOUDFLARE_TUNNEL_TOKEN in .env (see .env.example). The tunnel's public
    # hostname and routing are configured in the Cloudflare Zero Trust dashboard;
    # only the token is needed locally.
    profiles: ["tunnel"]
    # `:-` (empty default), NOT `:?`: compose interpolates a service's command
    # even when its profile is inactive, so a `:?` here would break plain
    # `docker compose config` / `up` when the tunnel profile is off (same
    # reason as the relay credential, issue #940). The blank-token fail-fast
    # for this service is cloudflared itself, which refuses an empty token at
    # startup. Only runs under the `tunnel` profile.
    #
    # `--metrics 127.0.0.1:20241` binds cloudflared's metrics/diagnostics
    # listener to container-loopback (issue #2601). Left unset it binds
    # 0.0.0.0:20241 and answers `/metrics`, `/debug/pprof/` and `/diag/*`
    # unauthenticated to every peer on this network. `--metrics` is a flag of
    # the `tunnel` command, not of its `run` subcommand
    # (`cloudflared tunnel [tunnel command options] run [subcommand options]`),
    # so it must precede `run`. Nothing scrapes or health-checks this port.
    # This is the control that does not depend on topology; network
    # segmentation (issue #2590) is the other one.
    command: tunnel --metrics 127.0.0.1:20241 run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
  api-storage:
  seaweedfs-data:

networks:
  # Two user-defined networks split by trust (issue #2590). Both carry an
  # explicit name because the worker attaches the sibling MC containers it
  # creates (via the Docker socket) to a network by NAME, and only a
  # user-defined network provides the container-name DNS its RCON dial needs —
  # the default bridge does not (issue #218).
  #
  # The names derive from the project name rather than being pinned literals
  # (issue #2609): a named network is shared, not namespaced by project, so a
  # literal `mcsd` put every stack brought up from any checkout onto the live
  # deployment's L2, container-name DNS included. With this form the project
  # pinned at the top of this file renders `mcsd` / `mcsd-servers` — today's
  # names, unchanged — and `-p <name>` / COMPOSE_PROJECT_NAME=<name> renders
  # `<name>` / `<name>-servers` instead, a separate fabric. The `:-mcsd`
  # fallback only matters on a Compose that does not populate the variable from
  # the top-level `name:` key; it keeps the shipped names in that case.
  #
  # `default` (mcsd) carries every first-party service: api, db, seaweedfs,
  # migrate, seaweedfs-lifecycle, relay, cloudflared and the worker. First-party
  # is not the same as authenticated — most of what binds here takes no
  # credential (see the seaweedfs block above: of the eight ports it still binds,
  # only the S3 gateway enforces on its data path), so membership of `mcsd` is
  # itself the privilege. That is why the containers running third-party plugin
  # code are on `servers` below instead (issue #2590).
  # `relay` and `cloudflared` are still here, and both terminate internet
  # traffic, so a compromise of either lands on `mcsd`.
  # CAUTION: renaming the default network recreates every service container on the
  # next `docker compose up` (the old default network is replaced).
  default:
    name: ${COMPOSE_PROJECT_NAME:-mcsd}
  # `servers` (mcsd-servers) holds the Minecraft server containers the worker
  # creates, plus the worker itself. Those containers run operator- and
  # community-supplied JARs, plugins and mods — code the operator did not write
  # and cannot audit — so this is the untrusted side of the split.
  # Deliberately NOT `internal: true`: MC servers need outbound internet for
  # Mojang online-mode authentication and plugin/mod downloads. What segmentation
  # removes is the lateral reach into the control plane, not egress.
  servers:
    name: ${COMPOSE_PROJECT_NAME:-mcsd}-servers
