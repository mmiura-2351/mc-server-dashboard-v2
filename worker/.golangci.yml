# golangci-lint configuration (schema v2). See https://golangci-lint.run.
# Pinned tool version is documented in worker/README.md.
version: "2"

linters:
  # Start from the curated default set and add a few high-signal linters.
  default: standard
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - depguard
  settings:
    depguard:
      # Import direction (docs/app/ARCHITECTURE.md Section 2.2):
      #
      #   edge (cmd/)  ->  application  ->  domain  <-  adapters
      #
      # Each rule covers one layer's non-test files. Tests are exempt: a test may
      # reach across layers for a real collaborator (domain/scratchformat's test
      # checks the datatransfer adapter and instancemanager agree on the format).
      # internal/nofollow and internal/javaproperties are shared helpers outside
      # the layers. cmd/ is the edge and may import anything; nothing can import it.
      rules:
        domain:
          # Pure core: the standard library and other domain packages only.
          list-mode: strict
          files:
            - "**/internal/domain/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/mmiura-2351/mc-server-dashboard-v2/worker/internal/domain
        application:
          files:
            - "**/internal/application/**"
            - "!$test"
          deny:
            - pkg: github.com/mmiura-2351/mc-server-dashboard-v2/worker/internal/adapters
              desc: application depends on domain Ports, never on an adapter; cmd/worker binds adapters to Ports (ARCHITECTURE.md Section 2.1)
            - pkg: github.com/mmiura-2351/mc-server-dashboard-v2/worker/internal/controlplane
              desc: generated gRPC stubs belong to adapters/controlplane, not to the application (ARCHITECTURE.md Section 2.1)
        adapters:
          files:
            - "**/internal/adapters/**"
            - "!$test"
          deny:
            - pkg: github.com/mmiura-2351/mc-server-dashboard-v2/worker/internal/application
              desc: adapters implement domain Ports and depend on domain only (ARCHITECTURE.md Section 2.2)
  exclusions:
    # Agent worktrees are created inside the repo at .claude/worktrees/<agent>/,
    # so a sibling checkout's worker/ is a full, mid-edit Go tree. golangci-lint
    # does not respect .gitignore, so exclude .claude explicitly to keep a walk
    # that ever resolves from the repo root (rather than this module's dir) from
    # reporting another in-flight worktree's transient findings (#347).
    paths:
      - .claude

formatters:
  enable:
    - gofmt
