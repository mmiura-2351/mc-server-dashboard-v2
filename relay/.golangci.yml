# golangci-lint configuration (schema v2). See https://golangci-lint.run.
# Pinned tool version is documented in worker/README.md.
version: "2"

linters:
  # Start from the curated default set and add a few high-signal linters.
  default: standard
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - depguard
  settings:
    depguard:
      # Import direction (docs/app/ARCHITECTURE.md Section 2.2), as the relay
      # applies it (relay/README.md "Layout"): cmd/relay is the edge and binds the
      # adapters under internal/adapters/; the other internal packages are the
      # relay's core and never import an adapter; an adapter imports no core
      # package, only the generated stubs it speaks. Tests are exempt, as in worker/.
      rules:
        core:
          files:
            - "**/internal/**"
            - "!**/internal/adapters/**"
            - "!**/internal/genproto/**"
            - "!$test"
            # Covered by core-apiclient-exception below instead.
            - "!**/internal/bedrock/listener.go"
            - "!**/internal/bedrock/tunnel.go"
            - "!**/internal/game/listener.go"
            - "!**/internal/relaysvc/relaysvc.go"
            - "!**/internal/session/reporter.go"
          deny: &core-deny
            - pkg: github.com/mmiura-2351/mc-server-dashboard-v2/relay/internal/adapters
              desc: the relay core depends on interfaces it declares, never on an adapter; cmd/relay binds adapters (ARCHITECTURE.md Section 2.1)
        core-apiclient-exception:
          # Exception tracked by follow-up #3408, to be removed by moving the
          # relay's API value types (Intent, ResolveResult and its Decision,
          # SessionStart, SessionEnd, Source) out of adapters/apiclient into a core
          # package: these files name them in their port interfaces and calls.
          # Every other adapter stays denied here.
          list-mode: lax
          files:
            - "**/internal/bedrock/listener.go"
            - "**/internal/bedrock/tunnel.go"
            - "**/internal/game/listener.go"
            - "**/internal/relaysvc/relaysvc.go"
            - "**/internal/session/reporter.go"
          allow:
            - github.com/mmiura-2351/mc-server-dashboard-v2/relay/internal/adapters/apiclient$
          deny: *core-deny
        adapters:
          list-mode: lax
          files:
            - "**/internal/adapters/**"
            - "!$test"
          allow:
            - github.com/mmiura-2351/mc-server-dashboard-v2/relay/internal/adapters
            - github.com/mmiura-2351/mc-server-dashboard-v2/relay/internal/genproto
          deny:
            - pkg: github.com/mmiura-2351/mc-server-dashboard-v2/relay/internal
              desc: an adapter never imports the relay core it is plugged into (ARCHITECTURE.md Section 2.2)
  exclusions:
    # Agent worktrees are created inside the repo at .claude/worktrees/<agent>/,
    # so a sibling checkout's worker/ is a full, mid-edit Go tree. golangci-lint
    # does not respect .gitignore, so exclude .claude explicitly to keep a walk
    # that ever resolves from the repo root (rather than this module's dir) from
    # reporting another in-flight worktree's transient findings (#347).
    paths:
      - .claude

formatters:
  enable:
    - gofmt
