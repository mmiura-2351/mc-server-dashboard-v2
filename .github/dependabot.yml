version: 2
updates:
  # --- Python (api/) ---
  - package-ecosystem: pip
    directory: /api
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps):"
    labels:
      - dependencies
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "protobuf"
        update-types: ["version-update:semver-major"]
    groups:
      production:
        dependency-type: production
        update-types:
          - minor
          - patch
      dev:
        dependency-type: development
        update-types:
          - minor
          - patch

  # --- Go worker ---
  - package-ecosystem: gomod
    directory: /worker
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps):"
    labels:
      - dependencies
    cooldown:
      default-days: 7
    groups:
      production:
        dependency-type: production
        update-types:
          - minor
          - patch
      dev:
        dependency-type: development
        update-types:
          - minor
          - patch

  # --- Go relay ---
  - package-ecosystem: gomod
    directory: /relay
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps):"
    labels:
      - dependencies
    cooldown:
      default-days: 7
    groups:
      production:
        dependency-type: production
        update-types:
          - minor
          - patch
      dev:
        dependency-type: development
        update-types:
          - minor
          - patch

  # --- React frontend ---
  - package-ecosystem: npm
    directory: /webui
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps):"
    labels:
      - dependencies
    cooldown:
      default-days: 7
    groups:
      production:
        dependency-type: production
        update-types:
          - minor
          - patch
      dev:
        dependency-type: development
        update-types:
          - minor
          - patch

  # --- OpenAPI codegen tool (webui/tools/openapi/) ---
  # A standalone npm project with its own package.json and lockfile,
  # deliberately not a webui workspace (see its package.json description).
  # Dependabot does not recurse into nested lockfiles, so the /webui entry
  # above never reaches it and it needs its own entry (#2910).
  - package-ecosystem: npm
    directory: /webui/tools/openapi
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps):"
    labels:
      - dependencies
    cooldown:
      default-days: 7
    groups:
      production:
        dependency-type: production
        update-types:
          - minor
          - patch
      dev:
        dependency-type: development
        update-types:
          - minor
          - patch

  # --- GitHub Actions ---
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps):"
    labels:
      - dependencies
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # --- Docker base images (api/) ---
  - package-ecosystem: docker
    directory: /api
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps):"
    labels:
      - dependencies
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "python"
        versions: [">=3.14"]
      # Skip the Node 25 "Current" (non-LTS) line; the next LTS (26) still gets a PR.
      - dependency-name: "node"
        versions: [">=25 <26"]
    groups:
      docker:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # --- Docker base images (worker/) ---
  - package-ecosystem: docker
    directory: /worker
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps):"
    labels:
      - dependencies
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # --- Docker base images (relay/) ---
  - package-ecosystem: docker
    directory: /relay
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps):"
    labels:
      - dependencies
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # --- Docker images (compose.yaml) ---
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps):"
    labels:
      - dependencies
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
