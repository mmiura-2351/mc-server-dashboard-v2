name: api

on:
  pull_request:
    paths:
      - "api/**"
      - "proto/contract/**"
      - "proto/mcsd/**"
      - "Makefile"
      - ".github/workflows/api.yml"
  push:
    branches: [main]
    paths:
      - "api/**"
      - "proto/contract/**"
      - "proto/mcsd/**"
      - "Makefile"
      - ".github/workflows/api.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: api

jobs:
  check:
    runs-on: ubuntu-latest
    # PostgreSQL service for the DB-touching integration tests
    # (tests/integration). Image digest-pinned per docs/dev/DEPENDENCIES.md
    # (pinning + 7-day cooldown).
    services:
      postgres:
        # postgres:18.6 (Debian; pushed 2026-08-25, outside the cooldown) -- the tag
        # compose.yaml pins.
        image: postgres@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_USER: mcsd
          POSTGRES_PASSWORD: mcsd
          POSTGRES_DB: mcsd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mcsd"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      # Action versions are pinned to a commit SHA per
      # docs/dev/DEPENDENCIES.md (pinning + 7-day cooldown).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv (caches the uv-managed toolchain)
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      - name: Sync (pinned Python + dev toolchain from uv.lock)
        run: uv sync --locked

      # Fast, non-DB guard against migration numbering collisions between
      # parallel PRs (issue #284). The pull_request event checks out the merge
      # ref (actions/checkout's default: PR combined with the target branch),
      # so this sees PR + current main together and fails the moment main moves
      # under a stale migration. Limitation: CI does not auto-re-run when main
      # moves, so the collision is caught at the next push or re-run; merge-time
      # protection is GitHub's "require branches up to date" setting, which is
      # out of repo scope. `alembic heads` is the authoritative single-head
      # check; check_migrations.py adds duplicate revision-id / filename-prefix
      # detection and is self-tested (--self-test).
      - name: Migration guard (single head, no number collisions)
        run: |
          ../scripts/check_migrations.py --self-test
          ../scripts/check_migrations.py
          heads="$(uv run alembic heads --resolve-dependencies)"
          count="$(printf '%s\n' "$heads" | grep -c .)"
          if [ "$count" -ne 1 ]; then
            echo "expected exactly one alembic head, found $count:" >&2
            printf '%s\n' "$heads" >&2
            exit 1
          fi

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy .

      - name: Import contracts (import-linter)
        run: uv run lint-imports

      - name: Test (pytest)
        # MCD_TEST_DATABASE_URL enables the DB-touching integration tests
        # (tests/integration) against the Postgres service; the unit suite is
        # hermetic and ignores it. The test session treats this as a base URL
        # and creates a fresh per-run `<dbname>_<uuid>` database off it (#379),
        # so the service's fresh `mcsd_test` is just the maintenance connection.
        env:
          MCD_TEST_DATABASE_URL: postgresql+asyncpg://mcsd:mcsd@localhost:5432/mcsd_test
          # coverage.py's sys.monitoring core (Python 3.13, coverage >= 7.4)
          # instruments at near-zero cost, versus the default sys.settrace
          # CTracer that was eating the -n auto parallel speedup (#1730).
          COVERAGE_CORE: sysmon
        # Coverage is CI-only (#325): local `uv run pytest` / `make api-test`
        # stay fast and uncluttered; CI surfaces the number and the missing
        # lines per source path. No floor enforced.
        run: uv run pytest -n auto --dist worksteal --cov=src --cov-report=term-missing

  # The MCD_TEST_S3_ENDPOINT-gated modules, run against a real SeaweedFS
  # (issue #2331). They pin the one dimension the in-memory stub cannot: a
  # backend whose `head` ContentLength disagrees with its `get` body
  # (tests/storage/fake_s3.py returns len(objects[key]) by construction, so the
  # two agree definitionally there). Both resource-pack download routes declare
  # Content-Length from store.size() while streaming the body from store.open()
  # (#2317), and backup downloads have the same shape (#2312); a disagreement
  # hangs the client over HTTP/2.
  #
  # A separate job, not part of `check`: only these two modules need the
  # container, so the rest of the api suite neither waits on it nor fails when
  # the registry is unreachable. Deliberately not a required status check yet —
  # see the PR that added it.
  live-s3:
    runs-on: ubuntu-latest
    steps:
      # Action versions are pinned to a commit SHA per
      # docs/dev/DEPENDENCIES.md (pinning + 7-day cooldown).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv (caches the uv-managed toolchain)
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      - name: Sync (pinned Python + dev toolchain from uv.lock)
        run: uv sync --locked

      # Started by hand rather than as a `services:` container so it runs the
      # mode the deployment runs: compose.yaml's seaweedfs service execs
      # `weed server -dir=/data -s3 -s3.config=...`, whereas the image's default
      # command is `mini` — a different mode, and the only one a `services:`
      # block can start, since that block has no field for the container command
      # (only image/env/ports/volumes/options). Testing against the deployed
      # mode is the point of this job, so: same image version, same `weed
      # server` invocation, same identities-file shape as compose.yaml. The
      # `mcsd` bucket is auto-created on first PUT.
      - name: Start SeaweedFS (S3 gateway)
        run: |
          mkdir -p "$RUNNER_TEMP/seaweedfs"
          printf '{"identities":[{"name":"ci","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' \
            mcsdaccess mcsdsecret > "$RUNNER_TEMP/seaweedfs/s3.json"

          # chrislusf/seaweedfs:4.41 (pushed 2026-08-06, outside the cooldown) —
          # the version compose.yaml pins, so CI exercises the backend the
          # deployment actually runs. Digest-pinned per docs/dev/DEPENDENCIES.md
          # (pinning + 7-day cooldown). Dependabot cannot see a digest pinned
          # inside a workflow `run:` block — neither its docker-compose ecosystem
          # (compose.yaml only) nor its github-actions one (`uses:` only) — so
          # this pin is bumped by hand whenever the compose pin moves. It sat on
          # 4.39 for two compose bumps because nothing does that automatically
          # (issue #2614).
          docker run -d --name seaweedfs -p 127.0.0.1:8333:8333 \
            -v "$RUNNER_TEMP/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro" \
            --entrypoint weed \
            chrislusf/seaweedfs@sha256:43b768cd62b00d132439cda881b93fd1adebf1b315e996e794087743821d771d \
            server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json

          # /status returns 200 once the S3 gateway is serving (no auth needed) —
          # the same readiness signal compose.yaml's healthcheck uses.
          ready=
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8333/status >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          # The container log is dumped by the `if: failure()` step below.
          if [ -z "$ready" ]; then
            echo "SeaweedFS did not become ready" >&2
            exit 1
          fi

      - name: Test (live S3 contract modules)
        # The bucket/credential defaults these modules fall back to are spelled
        # out anyway, so the job is readable without cross-referencing them.
        env:
          MCD_TEST_S3_ENDPOINT: http://127.0.0.1:8333
          MCD_TEST_S3_BUCKET: mcsd
          MCD_TEST_S3_ACCESS_KEY: mcsdaccess
          MCD_TEST_S3_SECRET_KEY: mcsdsecret
        # A job that silently skips everything is worse than no job: it looks
        # like coverage. Both modules skip on `MCD_TEST_S3_ENDPOINT is None`, so
        # any skip here means the endpoint did not reach pytest — fail on it
        # rather than report green. The count is read from the JUnit report, not
        # grepped out of the summary line: a summary-line match that stops
        # matching fails open (the guard silently becomes a no-op), while a
        # missing `skipped` attribute raises and fails the job. `-rs` prints the
        # reason for each skip.
        run: |
          uv run pytest -rs --junitxml="$RUNNER_TEMP/junit.xml" \
            tests/storage/test_object_live_seaweedfs.py \
            tests/servers/test_resource_pack_store_contract.py
          skipped="$(python3 -c 'import sys, xml.etree.ElementTree as ET; print(sum(int(s.attrib["skipped"]) for s in ET.parse(sys.argv[1]).iter("testsuite")))' "$RUNNER_TEMP/junit.xml")"
          if [ "$skipped" != 0 ]; then
            echo "::error::$skipped live-s3 test(s) skipped; MCD_TEST_S3_ENDPOINT did not reach pytest" >&2
            exit 1
          fi

      - name: SeaweedFS log on failure
        if: failure()
        run: docker logs seaweedfs || true
