name: sanity

# WHY this workflow is intentionally UNFILTERED (no `paths:` filter).
#
# Every other workflow (api, docs, proto, worker) is path-filtered, so a PR that
# touches only an unfiltered path (e.g. compose.yaml -- PR #195 precedent)
# triggers none of them and reports zero checks. Once branch protection requires
# a status context, such a PR can never satisfy it and can never merge (the #284
# residual: enabling "Require branches to be up to date"). This workflow runs on
# EVERY pull_request and push to main, so the required `check` context is always
# satisfiable. Its job is named `check` to match api/docs/proto/worker, letting a
# single required context cover all of them. Keep it cheap (<30s, no services).
# See issue #303.
#
# The `live-s3` job below is the same trick for the second path-filtered
# required context; see its own comment.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Action versions are pinned to a commit SHA per
      # docs/dev/DEPENDENCIES.md (pinning + 7-day cooldown).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Nothing below needs a setup action or a dependency install: the checkers
      # are pure stdlib python3 (ubuntu-latest ships it), mirroring docs.yml,
      # and the shell suites use only bash, git and make.
      #
      # Every step below except the workflow YAML parse also runs locally: the
      # migration guard (self-test + real run) via `make migrations-check`, the
      # docs checker (self-test + real run) via `make docs-check`, the
      # test-client guard (self-test + real run) via `make test-client-check`,
      # the api-env preflight's self-test via `make api-env-check` (its real run
      # needs the api venv, so only the self-test is here), the two hook suites
      # via `make hooks-test`, and the scripts/ suites via the Make target the
      # last step names. The YAML parse is CI-only -- it guards this directory,
      # which has no local gate.
      #
      # The python checkers stay spelled out because each is a gate worth naming
      # in the job's step list. The scripts/ suites do not, because there the
      # membership is the thing that has to stay in step with the Makefile, and
      # a hand-copied list did not: it was governed by a comment asking authors
      # to update two places, and five suites reached main with no CI run of
      # their own anyway (#2508, #2511, #2946).
      - name: Migration guard self-test
        run: python3 scripts/check_migrations.py --self-test

      - name: Migration guard (single head, no number collisions)
        run: (cd api && python3 ../scripts/check_migrations.py)

      - name: Docs checker self-test
        run: python3 scripts/check_docs.py --self-test

      - name: Docs conventions (links, section-mark glyph, v1 term)
        run: python3 scripts/check_docs.py

      - name: Test-client guard self-test
        run: python3 scripts/check_test_client_pattern.py --self-test

      - name: Test-client pattern (api/tests)
        run: python3 scripts/check_test_client_pattern.py

      - name: API env guard self-test
        run: python3 scripts/check_api_env.py --self-test

      # Unit-test the checked-in git hooks (post-checkout auto-restore,
      # hooks-check assertions). Pure bash + temp git repos; mirrors the
      # `make hooks-test` target so CI covers the same gate as local.
      - name: Hook tests (post-checkout)
        run: bash .githooks/test-post-checkout.sh

      - name: Hook tests (hooks-check)
        run: bash .githooks/test-hooks-check.sh

      # Every scripts/ suite this gate can afford, as the Make target that
      # defines that set: the cooldown self-test, the pipefail source guard, the
      # two check_parallel.sh suites and the two tool-pin suites. ~3s, bash and
      # python3 over temp dirs, nothing installed and nothing fetched. The
      # target deliberately excludes the deploy helper suites, which `make
      # scripts-test` adds on top; the Makefile carries that rationale.
      - name: Script suites (scripts-test-cheap)
        run: make scripts-test-cheap

      # YAML-parse every workflow so a malformed workflow fails fast. PyYAML is
      # preinstalled with ubuntu-latest's system python3.
      - name: Workflow YAML parse
        run: |
          python3 -c '
          import glob, yaml
          files = sorted(glob.glob(".github/workflows/*.yml"))
          assert files, "no workflow files found"
          for f in files:
              with open(f) as fh:
                  yaml.safe_load(fh)
              print("ok:", f)
          '

  # The unfiltered counterpart of api.yml's `live-s3` job, for exactly the
  # reason the header gives for `check`: `live-s3` is a required status check on
  # `main` (#2349) and api.yml is path-filtered, so a PR touching no api path
  # would never report that context and could never merge.
  #
  # This does not weaken the gate. api.yml's job reports the same context
  # whenever it runs, and branch protection is satisfied only when every check
  # run carrying a required name is green -- so a red live-s3 in api.yml still
  # blocks, and this job only answers for the PRs where the real one has nothing
  # to test.
  live-s3:
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder for the required live-s3 context
        run: |
          echo "This job exists only so the required live-s3 context is reported on"
          echo "PRs that trigger no api.yml run; it tests nothing. If this PR touched"
          echo "an api path, api.yml's live-s3 job is the one that tests anything,"
          echo "against a live SeaweedFS container."
