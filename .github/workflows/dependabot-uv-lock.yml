name: dependabot-uv-lock

on:
  pull_request:
    branches: [main]
    paths:
      - "api/pyproject.toml"

permissions:
  contents: write

jobs:
  regenerate:
    if: startsWith(github.head_ref, 'dependabot/pip/')
    runs-on: ubuntu-latest
    steps:
      # Action versions are pinned to a commit SHA per
      # docs/dev/DEPENDENCIES.md (pinning + 7-day cooldown).
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Regenerate uv.lock
        working-directory: api
        run: uv lock

      - name: Commit and push if changed
        run: |
          git diff --exit-code api/uv.lock && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/uv.lock
          git commit -m "chore(deps): regenerate uv.lock"
          git push
